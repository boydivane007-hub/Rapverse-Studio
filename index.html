<!DOCTYPE html><html><head><title>RAPVERSE V11</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#000;color:#fff;font-family:Arial;padding:20px;text-align:center} 
.card{background:#111;padding:20px;border-radius:15px;margin:10px auto;max-width:500px} 
.btn{background:#FFD700;color:#000;border:0;padding:15px;width:100%;border-radius:10px;font-weight:bold;margin:5px 0;cursor:pointer;font-size:16px} 
input,textarea{width:90%;padding:12px;background:#222;color:#fff;border:1px solid #333;border-radius:8px;margin:8px 0} 
h1{color:#FFD700;font-size:28px} 
#loader{display:none} .spinner{border:4px solid #333;border-top:4px solid #FFD700;border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
audio{width:100%;margin-top:15px}
</style>
</head><body>
<h1>RAPVERSE STUDIO</h1>
<div class="card">
  <h3>🎛️ GÉNÉRATEUR IA</h3>
  <input id="style" placeholder="Style: Drill, Afro, Trap..." value="Drill Francais">
  <textarea id="lyrics" placeholder="Écris tes paroles ici..." style="height:150px"></textarea>
  <button class="btn" onclick="generate()">🔴 GÉNÉRER MON SON</button>
  
  <div id="loader"><div class="spinner"></div><p>Génération en cours... 30s</p></div>
  <div id="result"></div>
</div>

<script>
async function generate(){
  const btn = document.querySelector('.btn');
  const lyrics = document.getElementById('lyrics').value;
  const style = document.getElementById('style').value;
  if(!lyrics) return alert('Écris des paroles d\'abord');
  
  loader.style.display='block';
  result.innerHTML='';
  btn.disabled=true;
  btn.innerText='GÉNÉRATION...';

  try{
    // Pour l'instant on simule. Après on branche Replicate
    await new Promise(r=>setTimeout(r,3000)); 
    
    result.innerHTML = `
      <h3>✅ Ton son est prêt !</h3>
      <audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
      <button class="btn" onclick="download()">⬇️ TÉLÉCHARGER</button>
    `;
  }catch(e){
    alert('Erreur: '+e.message)
  }
  loader.style.display='none';
  btn.disabled=false;
  btn.innerText='🔴 GÉNÉRER MON SON';
}

function download(){
  window.open('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')
}
</script></body></html>
