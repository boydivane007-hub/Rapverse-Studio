<!DOCTYPE html><html><head><title>RAPVERSE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px} 
.card{background:#111;padding:20px;border-radius:15px;max-width:500px;margin:auto;border:1px solid #FFD700} 
.btn{background:#FFD700;color:#000;padding:15px;width:100%;border:0;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
textarea{width:90%;height:150px;background:#222;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;font-size:14px}</style>
</head><body>
<h1>🔥 RAPVERSE STUDIO 🔥</h1>
<div class="card">
<textarea id="lyrics" placeholder="Ex: Afro drill, voix grave, prod sombre, parle de Yaoundé la nuit..."></textarea>
<button class="btn" onclick="generate()">🎵 GÉNÉRER MON SON</button>
<div id="result"></div>
</div>
<script>
async function generate(){
  const btn = document.querySelector('.btn');
  const lyrics = document.getElementById('lyrics').value;
  if(!lyrics){alert('Écris des paroles d\'abord'); return;}
  
  btn.innerText="GÉNÉRATION... 45s";
  btn.disabled=true;
  result.innerHTML="<p>Replicate travaille sur ton son...</p>";
  
  const res = await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lyrics})});
  const data = await res.json();
  
  if(data.url) result.innerHTML=`<h3>✅ TON SON EST PRÊT!</h3><audio controls src="${data.url}" style="width:100%"></audio>`;
  else result.innerHTML=`<p style="color:red">Erreur: ${data.error}</p>`;
  
  btn.innerText="🎵 GÉNÉRER MON SON";
  btn.disabled=false;
}
</script></body></html>
